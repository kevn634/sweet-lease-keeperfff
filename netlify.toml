[build]
  command = "npm ci && npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"

# Redirect all requests to the Netlify function (SSR handler)
# so that TanStack Router can handle all routes server-side.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
